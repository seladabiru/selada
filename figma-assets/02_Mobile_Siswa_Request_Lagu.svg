<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" rx="40" fill="#F8F7FF"/>
  <rect x="2" y="2" width="386" height="840" rx="38" stroke="#18181B" stroke-width="4"/>

  <!-- Status Bar -->
  <text x="24" y="32" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#18181B">09:41</text>
  <rect x="145" y="16" width="100" height="18" rx="9" fill="#18181B"/>
  <text x="325" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#18181B">5G 100%</text>

  <!-- Top Bar -->
  <g transform="translate(16, 50)">
    <text x="0" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#7C3AED">← Kembali ke Antrian</text>
  </g>

  <!-- Form Container -->
  <g id="FormCard" transform="translate(16, 88)">
    <rect x="4" y="4" width="358" height="520" rx="24" fill="#18181B"/>
    <rect width="358" height="520" rx="24" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

    <text x="20" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#18181B">➕ Form Request Lagu</text>
    <text x="20" y="54" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Lagu akan diputar OSIS saat istirahat siang.</text>

    <!-- Field 1: YouTube URL -->
    <text x="20" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#18181B">Link atau ID YouTube:</text>
    <rect x="20" y="100" width="318" height="42" rx="12" fill="#F8F7FF" stroke="#18181B" stroke-width="1.5"/>
    <text x="32" y="126" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#18181B">https://youtu.be/dQw4w9WgXcQ</text>

    <!-- Live Preview Card -->
    <g transform="translate(20, 156)">
      <rect width="318" height="70" rx="14" fill="#EDE9FE" stroke="#18181B" stroke-width="1.5"/>
      <rect x="10" y="10" width="68" height="50" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="1"/>
      <text x="36" y="40" font-size="16">🎬</text>
      <text x="88" y="32" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#18181B">Never Gonna Give You Up</text>
      <text x="88" y="48" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#6B7280">Rick Astley • 03:32</text>
      <text x="88" y="62" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#10B981">✓ Video Valid & Terdeteksi</text>
    </g>

    <!-- Field 2: Salam Dedikasi -->
    <text x="20" y="254" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#18181B">Pesan Dedikasi Siswa (Opsional):</text>
    <text x="280" y="254" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#9CA3AF">Max 255</text>
    <rect x="20" y="264" width="318" height="80" rx="12" fill="#F8F7FF" stroke="#18181B" stroke-width="1.5"/>
    <text x="32" y="290" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#18181B">"Semangat try out buat teman-teman kelas XII!</text>
    <text x="32" y="306" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#18181B">Semoga lulus semua yaa 🍕🔥"</text>

    <!-- Info Box -->
    <rect x="20" y="360" width="318" height="44" rx="12" fill="#FEF9C3" stroke="#18181B" stroke-width="1"/>
    <text x="32" y="380" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#854D0E">💡 Kuota: 1 lagu/hari • Durasi maks 10 menit</text>
    <text x="32" y="394" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#854D0E">Lagu yang mengandung kata kasar otomatis difilter.</text>

    <!-- Submit Button -->
    <g transform="translate(20, 424)">
      <rect x="3" y="3" width="318" height="48" rx="14" fill="#18181B"/>
      <rect width="318" height="48" rx="14" fill="#7C3AED" stroke="#18181B" stroke-width="2"/>
      <text x="96" y="29" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">🚀 Kirim Request Lagu</text>
    </g>
