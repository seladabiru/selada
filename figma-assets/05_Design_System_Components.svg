<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#F8F7FF"/>

  <!-- Title -->
  <g transform="translate(40, 40)">
    <rect width="1120" height="70" rx="20" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <text x="24" y="42" font-size="24">🎨</text>
    <text x="64" y="36" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#7C3AED">SELADA FM DESIGN SYSTEM &amp; COMPONENTS KIT</text>
    <text x="64" y="54" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Auto Layout Components, Tokens, &amp; Variants for Figma</text>
  </g>

  <!-- Section 1: Colors (Row 1) -->
  <g transform="translate(40, 130)">
    <rect x="4" y="4" width="1120" height="150" rx="24" fill="#18181B"/>
    <rect width="1120" height="150" rx="24" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

    <text x="24" y="34" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#18181B">1. COLOR TOKENS (PALET WARNA UTAMA)</text>

    <!-- Swatch 1 -->
    <g transform="translate(24, 48)">
      <rect width="160" height="76" rx="14" fill="#7C3AED" stroke="#18181B" stroke-width="2"/>
      <text x="14" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Electric Purple</text>
      <text x="14" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#EDE9FE">#7C3AED</text>
    </g>

    <!-- Swatch 2 -->
    <g transform="translate(204, 48)">
      <rect width="160" height="76" rx="14" fill="#FF4D8D" stroke="#18181B" stroke-width="2"/>
      <text x="14" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Pop Pink</text>
      <text x="14" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#FFE4E6">#FF4D8D</text>
    </g>

    <!-- Swatch 3 -->
    <g transform="translate(384, 48)">
      <rect width="160" height="76" rx="14" fill="#FACC15" stroke="#18181B" stroke-width="2"/>
      <text x="14" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#18181B">Sun Yellow</text>
      <text x="14" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#854D0E">#FACC15</text>
    </g>

    <!-- Swatch 4 -->
    <g transform="translate(564, 48)">
      <rect width="160" height="76" rx="14" fill="#10B981" stroke="#18181B" stroke-width="2"/>
      <text x="14" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Fresh Mint</text>
      <text x="14" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#D1FAE5">#10B981</text>
    </g>

    <!-- Swatch 5 -->
    <g transform="translate(744, 48)">
      <rect width="160" height="76" rx="14" fill="#EDE9FE" stroke="#18181B" stroke-width="2"/>
      <text x="14" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#7C3AED">Soft Lavender</text>
      <text x="14" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#7C3AED">#EDE9FE</text>
    </g>

    <!-- Swatch 6 -->
    <g transform="translate(924, 48)">
      <rect width="160" height="76" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2"/>
      <text x="14" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Charcoal Dark</text>
      <text x="14" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#A1A1AA">#18181B</text>
    </g>
  </g>

  <!-- Section 2: Badges & Buttons (Row 2) -->
  <g transform="translate(40, 300)">
    <rect x="4" y="4" width="1120" height="220" rx="24" fill="#18181B"/>
    <rect width="1120" height="220" rx="24" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

    <text x="24" y="34" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#18181B">2. STATUS BADGES &amp; TAGS</text>

    <!-- Badges Row -->
    <g transform="translate(24, 48)">
      <!-- Badge Menunggu -->
      <g transform="translate(0, 0)">
        <rect width="160" height="34" rx="17" fill="#FEF9C3" stroke="#18181B" stroke-width="1.5"/>
        <text x="20" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#854D0E">⏳ Menunggu Moderasi</text>
      </g>

      <!-- Badge Disetujui -->
      <g transform="translate(180, 0)">
        <rect width="130" height="34" rx="17" fill="#DBEAFE" stroke="#18181B" stroke-width="1.5"/>
        <text x="20" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#1E40AF">✓ Disetujui OSIS</text>
      </g>

      <!-- Badge ON AIR -->
      <g transform="translate(330, 0)">
        <rect width="150" height="34" rx="17" fill="#D1FAE5" stroke="#18181B" stroke-width="1.5"/>
        <text x="20" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#065F46">▶ ON AIR (Diputar)</text>
      </g>

      <!-- Badge Ditolak -->
      <g transform="translate(500, 0)">
        <rect width="110" height="34" rx="17" fill="#FFE4E6" stroke="#18181B" stroke-width="1.5"/>
        <text x="20" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#9F1239">✗ Ditolak</text>
      </g>

      <!-- Badge Populer -->
      <g transform="translate(630, 0)">
        <rect width="130" height="34" rx="17" fill="#FACC15" stroke="#18181B" stroke-width="1.5"/>
        <text x="20" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#18181B">🔥 Top Populer</text>
      </g>
    </g>

    <!-- Buttons Row Below -->
    <text x="24" y="126" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#18181B">3. BUTTON VARIANTS</text>
    <g transform="translate(24, 142)">
      <!-- Primary -->
      <g transform="translate(0, 0)">
        <rect x="3" y="3" width="180" height="44" rx="12" fill="#18181B"/>
        <rect width="180" height="44" rx="12" fill="#7C3AED" stroke="#18181B" stroke-width="2"/>
        <text x="32" y="27" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">🚀 Primary Action</text>
      </g>

      <!-- Accent -->
      <g transform="translate(200, 0)">
        <rect x="3" y="3" width="180" height="44" rx="12" fill="#18181B"/>
        <rect width="180" height="44" rx="12" fill="#FF4D8D" stroke="#18181B" stroke-width="2"/>
        <text x="36" y="27" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">❤️ Accent / Vote</text>
      </g>

      <!-- Secondary -->
      <g transform="translate(400, 0)">
        <rect x="3" y="3" width="180" height="44" rx="12" fill="#18181B"/>
        <rect width="180" height="44" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
        <text x="38" y="27" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#18181B">Secondary White</text>
      </g>

      <!-- Success Action -->
      <g transform="translate(600, 0)">
        <rect x="3" y="3" width="180" height="44" rx="12" fill="#18181B"/>
        <rect width="180" height="44" rx="12" fill="#10B981" stroke="#18181B" stroke-width="2"/>
        <text x="40" y="27" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">✓ Setujui Lagu</text>
      </g>
    </g>
  </g>

  <!-- Section 3: Song Item Component Card (Row 3) -->
  <g transform="translate(40, 540)">
    <rect x="4" y="4" width="1120" height="210" rx="24" fill="#18181B"/>
    <rect width="1120" height="210" rx="24" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

    <text x="24" y="34" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#18181B">4. MASTER COMPONENT: SONG ITEM CARD</text>

    <!-- Component Item Preview -->
    <g transform="translate(24, 54)">
      <rect x="4" y="4" width="1072" height="74" rx="16" fill="#18181B"/>
      <rect width="1072" height="74" rx="16" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

      <text x="20" y="42" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#7C3AED">#1</text>
      <rect x="60" y="14" width="64" height="46" rx="8" fill="#EDE9FE" stroke="#18181B" stroke-width="1"/>
      <text x="82" y="43" font-size="18">🎵</text>

      <text x="140" y="34" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#18181B">Ghea Indrawari — Jiwa yang Bersedih (Official Music Video)</text>
      <text x="140" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Hitz Pop Indonesia • Durasi: 03:42 • Pemohon: Alif (XII RPL 1) • Kelas Terdaftar</text>

      <!-- Vote Pill Component -->
      <rect x="830" y="18" width="86" height="38" rx="12" fill="#EDE9FE" stroke="#18181B" stroke-width="1.5"/>
      <text x="846" y="42" font-size="14">❤️</text>
      <text x="868" y="42" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#7C3AED">14 Votes</text>

      <!-- Status Badge -->
      <rect x="930" y="18" width="124" height="38" rx="12" fill="#D1FAE5" stroke="#18181B" stroke-width="1.5"/>
      <text x="946" y="42" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#047857">▶ SEDANG PUTAR</text>
    </g>

    <text x="24" y="166" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6B7280">💡 Tip: Drag &amp; drop file ini langsung ke kanvas Figma Anda. Seluruh shape, warna, teks, dan vector langsung 100% editable!</text>
  </g>
</svg>
