<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#F8F7FF"/>

  <!-- Top App Bar -->
  <g id="TopBar" transform="translate(40, 24)">
    <rect width="1360" height="64" rx="20" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <text x="24" y="38" font-size="22">🎛️</text>
    <text x="60" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#7C3AED">SELADA FM — DJ BROADCAST STUDIO</text>
    <text x="440" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#6B7280">Panel Kendali Operator Siaran Bel Sekolah</text>

    <!-- Session Badge -->
    <rect x="940" y="18" width="230" height="28" rx="14" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="955" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#047857">● SIARAN AKTIF (11:45 - 12:30)</text>

    <rect x="1190" y="16" width="150" height="32" rx="16" fill="#FACC15" stroke="#18181B" stroke-width="1.5"/>
    <text x="1206" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#18181B">Operator: OSIS Radio</text>
  </g>

  <!-- Left Column: Player & Controls (860px) -->
  <g id="LeftCol" transform="translate(40, 110)">
    <!-- Video Player Box -->
    <rect x="6" y="6" width="860" height="480" rx="28" fill="#18181B"/>
    <rect width="860" height="480" rx="28" fill="#0F172A" stroke="#18181B" stroke-width="2"/>

    <!-- YouTube Mock Screen -->
    <rect x="20" y="20" width="820" height="440" rx="20" fill="#1E293B"/>
    <circle cx="430" cy="210" r="48" fill="#18181B" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="430" cy="210" r="18" fill="#FF4D8D"/>
    <text x="424" y="215" font-size="16">🎵</text>

    <text x="430" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Ghea Indrawari — Jiwa yang Bersedih</text>
    <text x="430" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">02:14 / 03:42 • Kualitas HD 1080p</text>

    <!-- Progress Bar -->
    <rect x="180" y="340" width="500" height="8" rx="4" fill="#334155"/>
    <rect x="180" y="340" width="310" height="8" rx="4" fill="#FACC15"/>

    <!-- Bottom Controls Bar -->
    <g transform="translate(0, 508)">
      <rect x="4" y="4" width="860" height="80" rx="20" fill="#18181B"/>
      <rect width="860" height="80" rx="20" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

      <!-- Pause Button -->
      <rect x="20" y="18" width="130" height="44" rx="14" fill="#FACC15" stroke="#18181B" stroke-width="2"/>
      <text x="44" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#18181B">⏸ Pause</text>

      <!-- Skip Button -->
      <rect x="160" y="18" width="150" height="44" rx="14" fill="#FF4D8D" stroke="#18181B" stroke-width="2"/>
      <text x="182" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">⏭ Putar Lanjut</text>

      <!-- DJ Shoutout Box -->
      <rect x="330" y="14" width="510" height="52" rx="14" fill="#EDE9FE" stroke="#18181B" stroke-width="1.5"/>
      <text x="346" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#7C3AED">📢 Teks Bacaan DJ Penyiar:</text>
      <text x="346" y="52" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#18181B">"Semangat try out USK buat teman-teman XII RPL 1! Jangan lupa makan!"</text>
    </g>
  </g>

  <!-- Right Column: Queue & Moderation (470px) -->
  <g id="RightCol" transform="translate(930, 110)">
    <!-- Antrian Card -->
    <rect x="4" y="4" width="470" height="340" rx="24" fill="#18181B"/>
    <rect width="470" height="340" rx="24" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

    <text x="24" y="40" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#18181B">📋 Antrian Siaran Siap Putar</text>
    <rect x="370" y="24" width="76" height="24" rx="12" fill="#EDE9FE" stroke="#18181B" stroke-width="1"/>
    <text x="382" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#7C3AED">3 Lagu</text>

    <!-- Item 1 -->
    <g transform="translate(20, 60)">
      <rect width="430" height="64" rx="14" fill="#F8F7FF" stroke="#18181B" stroke-width="1.5"/>
      <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#18181B">1. Sal Priadi — Dari planet lain</text>
      <text x="16" y="46" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#6B7280">12 Votes ❤️ • Req: Nabila (XI MIPA 2)</text>
      <rect x="330" y="16" width="84" height="32" rx="10" fill="#FACC15" stroke="#18181B" stroke-width="1.5"/>
      <text x="346" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#18181B">▶ Putar</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 134)">
      <rect width="430" height="64" rx="14" fill="#F8F7FF" stroke="#18181B" stroke-width="1.5"/>
      <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#18181B">2. Coldplay — Viva La Vida</text>
      <text x="16" y="46" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#6B7280">8 Votes ❤️ • Req: Budi (X TKJ 3)</text>
      <rect x="330" y="16" width="84" height="32" rx="10" fill="#EDE9FE" stroke="#18181B" stroke-width="1.5"/>
      <text x="348" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#7C3AED">Urut #2</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 208)">
      <rect width="430" height="64" rx="14" fill="#F8F7FF" stroke="#18181B" stroke-width="1.5"/>
      <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#18181B">3. Tulus — Monokrom</text>
      <text x="16" y="46" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#6B7280">4 Votes ❤️ • Req: Fani (XI IPS)</text>
      <rect x="330" y="16" width="84" height="32" rx="10" fill="#EDE9FE" stroke="#18181B" stroke-width="1.5"/>
      <text x="348" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#7C3AED">Urut #3</text>
    </g>

    <!-- Moderation Box Below -->
    <g transform="translate(0, 360)">
      <rect x="4" y="4" width="470" height="220" rx="24" fill="#18181B"/>
      <rect width="470" height="220" rx="24" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

      <text x="24" y="36" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#18181B">⚖️ Moderasi Request Baru (1 Menunggu)</text>

      <g transform="translate(20, 54)">
        <rect width="430" height="136" rx="16" fill="#FEF9C3" stroke="#18181B" stroke-width="1.5"/>
        <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#18181B">LANY — Malibu Nights</text>
        <text x="16" y="46" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#6B7280">Pemohon: Reza (X RPL) • Durasi 04:12</text>
        <text x="16" y="64" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#854D0E">💬 "Lagu santai buat nemenin makan siang"</text>

        <!-- Moderation Action Buttons -->
        <rect x="16" y="84" width="180" height="38" rx="12" fill="#10B981" stroke="#18181B" stroke-width="1.5"/>
        <text x="64" y="108" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">✓ Setujui Lagu</text>

        <rect x="210" y="84" width="180" height="38" rx="12" fill="#F43F5E" stroke="#18181B" stroke-width="1.5"/>
        <text x="264" y="108" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">✗ Tolak</text>
      </g>
    </g>
  </g>
</svg>
